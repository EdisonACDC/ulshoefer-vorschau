<head>

<title>Plancia privata – Ulshöfer</title>
<style>
:root{--red:#E2001A;--red-d:#B5001A;--lime:#DCDA00;--ink:#1d1d1b;--muted:#555;--tone:#f2f2f2;--tone-2:#e4e4e4;--ok:#1f7a45;--face:"Helvetica Neue",Helvetica,Arial,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:var(--face);font-size:16px;line-height:1.5;color:var(--ink);background:#fff}
h1,h2,h3{margin:0;letter-spacing:-.02em;line-height:1.1}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.top{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;padding:14px 24px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}
.top h1{font-size:22px;margin-right:auto}
.top h1 small{display:block;font-size:13px;font-weight:400;color:#cfcfcf;letter-spacing:0;margin-top:2px}
.status{font-size:14px;font-weight:700;padding:6px 12px;border-radius:999px;background:#3a3a3a}
.status.dirty{background:var(--lime);color:var(--ink)}
.status.saved{background:var(--ok)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 18px;border-radius:999px;border:0;font:700 15px/1 var(--face);cursor:pointer;text-decoration:none;background:var(--red);color:#fff;transition:background-color .15s,transform .15s}
.btn:hover{background:var(--red-d)}.btn:active{transform:scale(.97)}
.btn-light{background:#fff;color:var(--ink)}.btn-light:hover{background:var(--tone-2)}
.btn-tone{background:var(--tone);color:var(--ink)}.btn-tone:hover{background:var(--tone-2)}
.btn-sm{min-height:34px;padding:0 12px;font-size:14px}
.wrap{max-width:1180px;margin:0 auto;padding:24px}
.intro{background:var(--tone);padding:18px 22px;margin-bottom:22px;font-size:15px}
.intro b{color:var(--red-d)}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.tab{border:0;background:var(--tone);min-height:44px;padding:0 18px;border-radius:999px;font:700 15px var(--face);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.tab:hover{background:var(--tone-2)}
.tab[aria-selected="true"]{background:var(--ink);color:#fff}
.tab .dot{width:10px;height:10px;border-radius:50%;background:var(--ok)}
.tab .dot.off{background:#aaa}
.panel h2{font-size:32px;margin-bottom:6px}
.panel>p{color:var(--muted);margin:0 0 20px}
.card{background:var(--tone);padding:22px;margin-bottom:18px}
.card h3{font-size:20px;margin-bottom:4px}
.card .hint{font-size:14px;color:var(--muted);margin:0 0 14px}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:8px 24px}
.f{display:grid;grid-template-columns:minmax(0,1fr) 120px 44px;gap:10px;align-items:center;padding:4px 0}
.f.wide{grid-template-columns:minmax(0,1fr) 240px}
.f label{font-size:15px}
.f .u{font-size:14px;color:var(--muted)}
input,select{font:15px var(--face);color:var(--ink);background:#fff;border:2px solid var(--tone-2);border-radius:0;min-height:40px;padding:6px 10px;width:100%}
input[type=number]{text-align:right}
input:focus,select:focus{border-color:var(--ink);outline:0}
input.ch,select.ch{border-color:var(--red);background:#fff4f5}
table{width:100%;border-collapse:collapse;background:#fff}
th{font-size:13px;text-align:left;padding:8px;color:var(--muted);font-weight:700;background:#fafafa}
td{padding:4px;border-top:1px solid var(--tone-2);vertical-align:middle}
td input,td select{min-height:36px;border-color:transparent}
td input[type=number]{width:110px}
td select{min-width:130px}
td:nth-child(2) input{min-width:260px}
td input:hover,td select:hover{border-color:var(--tone-2)}
td.act{white-space:nowrap;width:1%}
.ib{border:0;background:var(--tone);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:16px;line-height:1}
.ib:hover{background:var(--tone-2)}
.ib.del:hover{background:var(--red);color:#fff}
.tbl-acts{margin-top:10px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:16px;background:#fff;padding:14px 16px;margin-bottom:8px;cursor:pointer}
.sw b{font-size:17px}
.sw small{display:block;color:var(--muted);font-size:14px}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw .knob{flex:none;width:58px;height:32px;border-radius:999px;background:#bbb;position:relative;transition:background-color .2s}
.sw .knob::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.sw input:checked+.knob{background:var(--ok)}
.sw input:checked+.knob::after{transform:translateX(26px)}
.sw input:focus-visible+.knob{outline:3px solid var(--ink);outline-offset:2px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-weight:700;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.where{font-size:13px;color:#cfcfcf}
@media (max-width:700px){.top{position:static}}
.lang{display:flex;gap:4px}.lang button{all:unset;cursor:pointer;padding:6px 10px;border-radius:6px;font-weight:700;font-size:14px;color:#cfcfcf;border:1px solid #555}.lang button[aria-pressed="true"]{background:#fff;color:#111;border-color:#fff}
.tc{text-align:center}
.imgc{display:flex;align-items:center;gap:6px;justify-content:center;min-width:110px}
.imgc img{width:48px;height:48px;object-fit:contain;border:1px solid var(--tone-2);border-radius:6px;background:#fff}
.noimg{font-size:12px;color:#888;width:48px}
.ib.up{cursor:pointer;display:inline-grid;place-items:center}
.mini{position:relative;display:inline-block;width:42px;height:24px;cursor:pointer}
.mini input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.mini span{position:absolute;inset:0;border-radius:12px;background:#c9c9c9;transition:background .2s}
.mini span::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
.mini input:checked+span{background:#1f7a46}.mini input:checked+span::after{transform:translateX(18px)}
.mini input:focus-visible+span{outline:3px solid #111;outline-offset:2px}
.testnote{background:#fff4e5;border-left:4px solid #E2001A;padding:12px 14px;border-radius:8px;margin:0 0 16px;font-size:15px}
.startbox{background:var(--tone);padding:36px;max-width:760px}
.startbox h2{font-size:32px;margin-bottom:12px}
.startbox p{font-size:17px}
.startbox .row{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}
.startbox .small{font-size:14px;color:var(--muted)}
@media (max-width:700px){.f{grid-template-columns:1fr 110px 36px}.f.wide{grid-template-columns:1fr}.top{padding:12px 16px}.wrap{padding:16px}table{display:block;overflow-x:auto}}
</style>

  if(c.pv&&c.pv.wallbox_h===undefined)c.pv.wallbox_h=(c.pv.wallbox&&+c.pv.wallbox.h)||5;
  if(c.elektro&&c.elektro.wallbox_h===undefined)c.elektro.wallbox_h=(c.elektro.wallbox&&+c.elektro.wallbox.h)||7;

function shrink(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const m=480,sc=Math.min(1,m/Math.max(im.width,im.height));const cv=document.createElement('canvas');cv.width=Math.round(im.width*sc);cv.height=Math.round(im.height*sc);const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);x.drawImage(im,0,0,cv.width,cv.height);res(cv.toDataURL('image/jpeg',.82))};im.src=fr.result};fr.readAsDataURL(file)})}

let cur='generale';
function tabDot(t){if(!t.k)return'';return `<span class="dot${CFG.aktiv[t.k]?'':' off'}" title="${tr(CFG.aktiv[t.k]?'visibile':'nascosto')}"></span>`}
function renderTabs(){$('#tabs').innerHTML=TABS.map(t=>`<button class="tab" role="tab" aria-selected="${t.id===cur}" data-t="${t.id}">${tabDot(t)}${esc(tr(t.t))}</button>`).join('')}
function field([p,l,u]){const v=get(p);const txt=u==='txt';const ch=JSON.stringify(v)!==JSON.stringify(origGet(p));
  return txt?`<div class="f wide"><label for="f-${p}">${esc(tr(l))}</label><input id="f-${p}" data-p="${p}" data-t="text" value="${esc(v)}" class="${ch?'ch':''}"></div>`

let ORIGOBJ=null;const origGet=p=>p.split('.').reduce((o,k)=>o==null?o:o[k],ORIGOBJ);
function table(s){const rows=get(s.path);
  return `<table><thead><tr>${s.col.map(c=>`<th>${esc(tr(c[1]))}${c[3]&&typeof c[3]==='string'?' ('+esc(tr(c[3]))+')':''}</th>`).join('')}<th></th></tr></thead><tbody>${rows.map((r,i)=>`<tr>${s.col.map(c=>{const v=r[c[0]];const a=`data-path="${s.path}" data-i="${i}" data-k="${c[0]}" aria-label="${esc(tr(c[1]))} ${tr('riga')} ${i+1}"`;
    if(c[2]==='sel')return `<td><select ${a}>${Object.entries(c[3]).map(([k,l])=>`<option value="${k}"${k===v?' selected':''}>${l}</option>`).join('')}</select></td>`;
    if(c[2]==='psel'){const ps=(CFG.shop&&CFG.shop.partner||[]).map(x=>x.name);if(v&&!ps.includes(v))ps.push(v);return `<td><select ${a}>${ps.map(n=>`<option${n===v?' selected':''}>${esc(n)}</option>`).join('')}</select></td>`}
    if(c[2]==='bool')return `<td class="tc"><label class="mini"><input type="checkbox" ${a} data-bool="1"${v!==false?' checked':''}><span></span></label></td>`;
    if(c[2]==='img')return `<td class="tc"><div class="imgc">${v?`<img src="${esc(v)}" alt="">`:`<span class="noimg">${LANG==='de'?'kein Bild':'nessuna'}</span>`}<label class="ib up" title="${LANG==='de'?'Bild hochladen':'Carica foto'}">⬆<input type="file" accept="image/*" ${a} data-img="1" hidden></label>${v?`<button class="ib del" data-imgdel="${s.path}" data-i="${i}" data-k="${c[0]}" title="${LANG==='de'?'Bild entfernen':'Rimuovi foto'}">×</button>`:''}</div></td>`;
    return `<td><input ${a} ${c[2]==='num'?'type="number" step="any" min="0"':''} value="${esc(v)}"></td>`}).join('')}<td class="act"><button class="ib" data-up="${s.path}" data-i="${i}" title="${tr('Sposta su')}" aria-label="${tr('Sposta su')} ${tr('riga')} ${i+1}">↑</button> <button class="ib del" data-del="${s.path}" data-i="${i}" title="${tr('Elimina')}" aria-label="${tr('Elimina')} ${tr('riga')} ${i+1}">×</button></td></tr>`).join('')}</tbody></table>
    <div class="tbl-acts"><button class="btn btn-tone btn-sm" data-add="${s.path}">${tr('+ Aggiungi riga')}</button></div>`}
function renderPanel(){
  const t=TABS.find(x=>x.id===cur);
  let h=`<section class="panel"><h2>${esc(tr(t.t))}</h2>`;
  if(t.k)h+=`<label class="sw"><span><b>${tr('Visibile sul sito')}</b><small>${LANG==='de'?'Zeigt den Button':'Mostra il pulsante'} „${esc({wp:'Wärmepumpe',pv:'Photovoltaik',klima:'Klimaanlage',smart:'Smart Home',elektro:'Elektro',shop:'Hausgeräte'}[t.k])}“ ${t.k==='shop'?(LANG==='de'?'(Online-Bestellung)':'(ordini online)'):(LANG==='de'?'im Rechner':'nel calcolatore')}</small></span><input type="checkbox" data-aktiv="${t.k}"${CFG.aktiv[t.k]?' checked':''}><span class="knob"></span></label>`;
  for(const s of t.sez){
    h+=`<div class="card"><h3>${esc(tr(s.t))}</h3>${s.hint?`<p class="hint">${esc(tr(s.hint))}</p>`:'<p class="hint"></p>'}`;
    if(s.tipo==='toggles')h+=s.items.map(([k,l,de])=>`<label class="sw"><span><b>${esc(tr(l))}</b><small>${tr('Pulsante')} „${esc(de)}“</small></span><input type="checkbox" data-aktiv="${k}"${CFG.aktiv[k]?' checked':''}><span class="knob"></span></label>`).join('');
    if(s.tipo==='campi')h+=`<div class="fields">${s.campi.map(field).join('')}</div>`;
    if(s.tipo==='tabella')h+=table(s);
    h+='</div>';
  }
  $('#panels').innerHTML=h+'</section>';
}

  if(el.tagName==='SELECT'&&el.dataset.path){get(el.dataset.path)[+el.dataset.i][el.dataset.k]=el.value}
  if(el.dataset.bool){get(el.dataset.path)[+el.dataset.i][el.dataset.k]=el.checked;if(el.dataset.path==='shop.partner')renderPanel()}
  if(el.dataset.img&&el.files&&el.files[0]){const row=get(el.dataset.path)[+el.dataset.i],k=el.dataset.k;shrink(el.files[0]).then(u=>{row[k]=u;renderPanel();dirty()}).catch(()=>toast(LANG==='de'?'Bild konnte nicht gelesen werden':'Foto non leggibile'))}
  dirty();});
function $$(s){return [...document.querySelectorAll(s)]}
$('#panels').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.imgdel){get(b.dataset.imgdel)[+b.dataset.i][b.dataset.k]='';renderPanel();dirty();return}
  if(b.dataset.add){const arr=get(b.dataset.add);const tmpl=arr[arr.length-1]||{};const n={};for(const k in tmpl)n[k]=typeof tmpl[k]==='number'?0:(typeof tmpl[k]==='boolean'?true:'');if('bild' in tmpl)n.bild='';if('aktiv' in tmpl)n.aktiv=true;if('partner' in tmpl)n.partner=tmpl.partner;if(!Object.keys(n).length){n.hersteller='';n.modell='';n.preis=0}if('klasse' in tmpl)n.klasse='std';arr.push(n);renderPanel();dirty();const ins=$$(`[data-path="${b.dataset.add}"][data-i="${arr.length-1}"]`);if(ins[0])ins[0].focus()}
  if(b.dataset.del){const arr=get(b.dataset.del);const r=arr[+b.dataset.i];if(!confirmDel(r))return;arr.splice(+b.dataset.i,1);renderPanel();dirty()}
  if(b.dataset.up){const arr=get(b.dataset.up),i=+b.dataset.i;if(i>0){[arr[i-1],arr[i]]=[arr[i],arr[i-1]];renderPanel();dirty()}}
});
let delArm=null;
function confirmDel(r){const key=JSON.stringify(r);if(delArm===key){delArm=null;return true}delArm=key;toast(tr('Premi di nuovo × per eliminare la riga'));setTimeout(()=>{if(delArm===key)delArm=null},4000);return false}

/* ---------- Status ---------- */
function dirty(){if(!CFG)return;const d=JSON.stringify(CFG)!==lastSaved;const s=$('#status');s.textContent=tr(d?'Modifiche non salvate':(savedOnce?'Salvato ✓':'Nessuna modifica'));s.className='status'+(d?' dirty':savedOnce?' saved':'')}
let lastSaved='',savedOnce=false;
addEventListener('beforeunload',e=>{if(CFG&&JSON.stringify(CFG)!==lastSaved){e.preventDefault();e.returnValue=''}});
let tt=null;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,3800)}

/* ---------- Laden / Speichern (Datei ulshoefer-vorschau.html) ---------- */
const M1='/*ULS_CONFIG_START*/',M2='/*ULS_CONFIG_END*/';
function parseSite(text){const i=text.indexOf(M1),j=text.indexOf(M2);if(i<0||j<0)throw new Error('marker');const blk=text.slice(i+M1.length,j);const a=blk.indexOf('{',blk.indexOf('window.ULS_CONFIG')),b=blk.lastIndexOf('}');return JSON.parse(blk.slice(a,b+1))}
function blockText(){
  CFG.stand=new Date().toISOString().slice(0,10);
  return `\n/* =====================================================================\n   KONFIGURATION – Angebotsrechner Elektrotechnik Ulshöfer GmbH\n   Bearbeiten mit der Preisverwaltung (ulshoefer-admin.html)\n   Gespeichert am ${new Date().toLocaleString('de-DE')}\n   ===================================================================== */\nwindow.ULS_CONFIG = ${JSON.stringify(CFG,null,2)};\n`;
}
function newSite(){const i=SITE.indexOf(M1),j=SITE.indexOf(M2);return SITE.slice(0,i+M1.length)+blockText()+SITE.slice(j)}
function load(text,name){
  let c;try{c=parseSite(text)}catch(e){toast(X('notsite'));return}
  if(c.aktiv&&c.aktiv.chat===undefined)c.aktiv.chat=true;
  migrate(c);
  if(c.smart&&!c.smart.loxone)c.smart.loxone={name:'Loxone (Miniserver, Tree/Air)',zentrale:{preis:900,h:12},licht:{preis:160,h:1.5},heizung:{preis:120,h:1},rollladen:{preis:140,h:1.5},sicherheit:{preis:600,h:5}};
  SITE=text;fname=name||fname;CFG=c;ORIG=JSON.stringify(c);ORIGOBJ=JSON.parse(ORIG);lastSaved=ORIG;savedOnce=false;
  $('#startbox').hidden=true;$('#editor').hidden=false;$('#save').hidden=false;$('#download').hidden=false;const vm=text.match(/name="uls-version" content="([^"]+)"/);SITEVER=vm?vm[1]:'';$('#openSite').hidden=!WEB;applyLang();
}
const idb=(mode,fn)=>new Promise((res,rej)=>{const r=indexedDB.open('uls-admin',2);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('h'))r.result.createObjectStore('h')};r.onsuccess=()=>{const tx=r.result.transaction('h',mode);const st=tx.objectStore('h');const q=fn(st);tx.oncomplete=()=>res(q&&q.result);tx.onerror=()=>rej(tx.error)};r.onerror=()=>rej(r.error)});
async function openHandle(h){
  if((await h.queryPermission({mode:'readwrite'}))!=='granted'&&(await h.requestPermission({mode:'readwrite'}))!=='granted'){toast(X('denied'));return}
  fh=h;const f=await h.getFile();load(await f.text(),f.name);
}
$('#pick').addEventListener('click',async()=>{
  if(window.showOpenFilePicker){try{const [h]=await showOpenFilePicker({id:'ulshoefer',types:[{description:'Sito Ulshöfer',accept:{'text/html':['.html']}}]});try{await idb('readwrite',s=>s.put(h,'site'))}catch(e){}await openHandle(h)}catch(e){if(e.name!=='AbortError'){console.error(e);$('#fileIn').click()}}}
  else $('#fileIn').click();
});
$('#fileIn').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;fh=null;load(await f.text(),f.name);applyLang()});
(async()=>{if(WEB)return;try{const h=await idb('readonly',s=>s.get('site'));if(h){const r=$('#resume');r.hidden=false;r.textContent=X('cont')+h.name;r.onclick=()=>openHandle(h).catch(()=>toast(X('notfound')))}}catch(e){}})();
function download(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([newSite()],{type:'text/html'}));a.download=fname;document.body.appendChild(a);a.click();a.remove();lastSaved=JSON.stringify(CFG);savedOnce=true;dirty();toast(X('dl')(fname))}
async function save(){
  if(!CFG)return;
  if(WEB){try{CFG.stand=new Date().toISOString().slice(0,10);localStorage.setItem('uls-test-config',JSON.stringify(CFG));lastSaved=JSON.stringify(CFG);savedOnce=true;dirty();$('#undo').hidden=false;toast(X('savedweb'))}catch(e){toast(X('saveFail'));download()}return}
  if(!fh){download();return}
  try{
    const cur=await (await fh.getFile()).text();
    try{await idb('readwrite',s=>s.put(cur,'backup'))}catch(e){}
    SITE=cur;const out=newSite();
    const w=await fh.createWritable();await w.write(out);await w.close();SITE=out;
    lastSaved=JSON.stringify(CFG);savedOnce=true;dirty();$('#undo').hidden=false;
    toast(X('saved'));
  }catch(e){if(e&&e.name==='AbortError')return;console.error(e);toast(X('saveFail'));download()}
}
async function undo(){
  if(WEB){try{localStorage.removeItem('uls-test-config')}catch(e){}CFG=JSON.parse(ORIG);lastSaved=ORIG;savedOnce=false;$('#undo').hidden=true;render();toast(X('reset'));return}
  if(!fh)return;const old=await idb('readonly',s=>s.get('backup'));if(!old){toast(X('noprev'));return}
  const w=await fh.createWritable();await w.write(old);await w.close();load(old,fname);toast(X('restored'));
}
$('#save').addEventListener('click',save);
$('#download').addEventListener('click',()=>{if(CFG)download()});
$('#undo').addEventListener('click',undo);
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();save()}});
applyLang();
if(WEB){$('#pick').hidden=true;$('#resume').hidden=true;
  fetch('./index.html',{cache:'no-store'}).then(r=>r.text()).then(t=>{fname='ulshoefer-website.html';load(t,fname);
    let test=null;try{test=JSON.parse(localStorage.getItem('uls-test-config')||'null')}catch(e){}
    if(test&&test.allgemein){CFG=test;lastSaved=JSON.stringify(CFG);savedOnce=true;$('#undo').hidden=false;render()}
  }).catch(()=>{$('#startText').innerHTML='<h2>'+X('loadfail')+'</h2>'})}
})();
</script>
</body>
</html>
