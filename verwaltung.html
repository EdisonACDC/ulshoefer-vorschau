.wrap{max-width:1180px;margin:0 auto;padding:24px}
.intro{background:var(--tone);padding:18px 22px;margin-bottom:22px;font-size:15px}

.panel>p{color:var(--muted);margin:0 0 20px}
.card{background:var(--tone);padding:22px;margin-bottom:18px}
.card h3{font-size:20px;margin-bottom:4px}

.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:8px 24px}

.f.wide{grid-template-columns:minmax(0,1fr) 240px}
.f label{font-size:15px}
.f .u{font-size:14px;color:var(--muted)}
input,select{font:15px var(--face);color:var(--ink);background:#fff;border:2px solid var(--tone-2);border-radius:0;min-height:40px;padding:6px 10px;width:100%}
input[type=number]{text-align:right}
input:focus,select:focus{border-color:var(--ink);outline:0}
input.ch,select.ch{border-color:var(--red);background:#fff4f5}
table{width:100%;border-collapse:collapse;background:#fff}
th{font-size:13px;text-align:left;padding:8px;color:var(--muted);font-weight:700;background:#fafafa}
td{padding:4px;border-top:1px solid var(--tone-2);vertical-align:middle}
td input,td select{min-height:36px;border-color:transparent}
td input[type=number]{width:110px}
td select{min-width:130px}
td:nth-child(2) input{min-width:260px}
td input:hover,td select:hover{border-color:var(--tone-2)}
td.act{white-space:nowrap;width:1%}
.ib{border:0;background:var(--tone);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:16px;line-height:1}
.ib:hover{background:var(--tone-2)}
.ib.del:hover{background:var(--red);color:#fff}
.tbl-acts{margin-top:10px}
table{display:block;overflow-x:auto;max-width:100%}
.sw{display:flex;align-items:center;justify-content:space-between;gap:16px;background:#fff;padding:14px 16px;margin-bottom:8px;cursor:pointer}
.sw b{font-size:17px}
.sw small{display:block;color:var(--muted);font-size:14px}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw .knob{flex:none;width:58px;height:32px;border-radius:999px;background:#bbb;position:relative;transition:background-color .2s}
.sw .knob::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-weight:700;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.25)}

.tc{text-align:center}

.noimg{font-size:12px;color:#888;width:48px}
.ib.up{cursor:pointer;display:inline-grid;place-items:center}
.mini{position:relative;display:inline-block;width:42px;height:24px;cursor:pointer}

const BSP={"Pulsanti visibili sul sito": ["Sie möchten vorübergehend keine Smart-Home-Anfragen: Schalter „Smart Home“ auf grau stellen und speichern. Der Bereich verschwindet aus dem Rechner, die Beschreibung unter „Leistungen“ bleibt mit „Beratung anfragen“. Genauso blenden Sie die Hausgeräte-Bestellung oder den Chat-Assistenten aus.", "m-sichtbar"], "Manodopera e preventivo": ["Stundensatz von 68 € auf 75 € ändern: Eine Klimaanlage für ein 16-m²-Schlafzimmer kostet im Rechner dann 2.613 € statt 2.536 €. Die Anfahrt wird pro Angebot nur einmal berechnet.", "m-stundensatz"], "Incentivi KfW (pompa di calore, programma 458)": ["Ab 1.2.2027 „Klimageschwindigkeitsbonus“ auf 12 % und „Max. förderfähige Kosten“ auf 27.250 € setzen. Heute ergibt eine Wärmepumpe für 150 m² (bisher Ölheizung) 12.050 € Zuschuss bei 26.250 € Richtpreis.", "m-kfw"], "Macchine mono-split (kit interna + esterna)": ["Nettopreis des Toshiba Seiya 2,5 kW von 990 € auf 1.090 € ändern → Richtpreis 16-m²-Schlafzimmer steigt von 2.536 € auf 2.655 €. Neues Gerät: „+ Zeile hinzufügen“, Leistung und Klasse eintragen – die Website wählt automatisch das kleinste passende, bei gleicher Leistung das günstigste Gerät. Neu: Energieklasse Kühlen/Heizen, SEER, SCOP, Schalldruck und Kältemittel eintragen; die Links zu Energielabel und Produktdatenblatt kopieren Sie aus der EU-Datenbank EPREL (Modellnummer suchen). Der Kunde sieht dann im Rechner eine Modellkarte mit Foto, Energiepfeil und Datenblatt und kann ein anderes Modell wählen (siehe Kapitel 14).", "m-neugeraet"], "Unità interne multi-split": ["Bei mehreren Räumen wählt die Website je Raum ein Innengerät aus dieser Liste und dazu ein Außengerät mit genügend Anschlüssen.", "m-neugeraet"], "Unità esterne multi-split": ["Außengerät „RAS-3M18“ mit 3 Anschlüssen: wird für 2–3 Räume gewählt, wenn die Leistung reicht. Nicht lieferbar? Schalter „Aktiv“ ausschalten.", "m-aktiv"], "Macchine (pompe di calore aria-acqua)": ["Bei 150 m², teilsaniert, ergibt sich eine Heizlast von ca. 10 kW – die Website wählt dann das 12-kW-Gerät (LA 0712C). Ein neues Gerät mit 10 kW würde ab sofort stattdessen gewählt.", "m-neugeraet"], "Moduli": ["Die Website rechnet immer mit dem ERSTEN Modul der Liste. Neues Modul anlegen und mit ↑ ganz nach oben schieben – fertig.", "m-aktiv"], "Inverter": ["Bei 8 kWp Modulleistung muss der Wechselrichter mindestens 6,4 kW haben – gewählt wird dann der kleinste passende (z. B. 8 kW).", "m-neugeraet"], "Accumuli": ["Jeder aktive Speicher erscheint im Rechner als Auswahl für den Kunden (z. B. 5,1 / 7,7 / 10,2 kWh).", "m-neugeraet"], "Wallbox": ["Die Wallbox-Modelle stehen im Reiter „Elektroinstallation“. Hier tragen Sie nur die Montagestunden ein, wenn die Wallbox zusammen mit einer PV-Anlage installiert wird.", "m-wallbox"], "Wallbox (per impianto elettrico e fotovoltaico)": ["„+ Zeile hinzufügen“ → Hersteller „Webasto“, Modell „Unite 11 kW“, Leistung 11, Nettopreis 780 € → speichern. Die Wallbox erscheint sofort in der Auswahl im Rechner.", "m-wallbox"], "Partner / marche": ["Neuer Partner: „+ Zeile hinzufügen“ → Name „Bosch Hausgeräte“. Schalter „Aktiv“ grau = Partner samt Produkten wird in der Online-Bestellung ausgeblendet.", "m-hausgeraete"], "Prodotti": ["„+ Zeile hinzufügen“ → Hersteller „Bosch Hausgeräte“, Kategorie „Waschmaschine“, Modell „Serie 6 Waschmaschine 9 kg“, Bruttopreis 899 €, Anschluss/Montage 49 €, Bild mit ⬆ hochladen → speichern. Kategorien immer gleich schreiben, damit der Filter funktioniert. Für Geräte mit Energielabel (Waschmaschine, Trockner, Geschirrspüler, Kühlschrank, Backofen) Energieklasse, Label-Skala und die EPREL-Links eintragen – der Pfeil erscheint dann neben dem Preis.", "m-hausgeraete"], "Servizi": ["Lieferung 39 € und Altgerät 25 € je Gerät: 2 Waschmaschinen + 1 Geschirrspüler mit Anschluss, Altgerät und Lieferung ergeben 2.261,00 € inkl. MwSt. – bei Abholung 2.094,00 €.", "m-hausgeraete"], "Sistema Loxone": ["Der Rechner rechnet: Zentrale + Licht/Heizung je Raum + Rolll /*MANUAL_START*/const MANUAL="<section class=\"man-sec\" id=\"m-ueberblick\">\n<h2>1. Überblick: Wofür ist die Preisverwaltung?</h2>\n<p>Mit der Preisverwaltung legen Sie fest, womit die Website rechnet und was sie anzeigt: Stundensatz, Anfahrt, Gerätepreise, Arbeitszeiten, Material, KfW-Förderung, Wallboxen, Hausgeräte mit Partnern und Produkten sowie die Produktbilder. Außerdem schalten Sie Bereiche, einzelne Geräte, die Hausgeräte-Bestellung und den Chat-Assistenten ein oder aus.</p>\n<p>Es gibt zwei Arten, mit der Preisverwaltung zu arbeiten:</p>\n<ul>\n<li><b>Online-Test</b> (Link <i>verwaltung.html</i>): Änderungen werden nur in Ihrem Browser gespeichert. Sie sehen sie sofort auf der Website – aber nur auf diesem Gerät. Ideal zum Ausprobieren.</li>\n<li><b>Am PC mit der Website-Datei</b> (Datei <i>ulshoefer-admin.html</i>): Die Preisverwaltung schreibt die Preise direkt in die Website-Datei (z. B. <i>ulshoefer-v0.9.12.html</i>). Diese Datei wird später auf den Server geladen – dann gelten die Preise für alle Kunden.</li>\n</ul>\n<div class=\"bsp\"><b>Gut zu wissen:</b> Alle Preise in den Reitern Klimaanlage, Wärmepumpe, Photovoltaik, Smart Home und Elektroinstallation sind <b>Nettopreise</b>. Die Website rechnet die Mehrwertsteuer selbst dazu. Nur im Reiter <b>Hausgeräte</b> tragen Sie <b>Bruttopreise</b> ein – so, wie sie im Laden am Gerät stehen.</div>\n</section>\n\n<section class=\"man-sec\" id=\"m-bedienung\">\n<h2>2. Die Bedienung auf einen Blick</h2>\n<ul>\n<li><b>Reiter</b> (Allgemein, Klimaanlage, Wärmepumpe, Photovoltaik, Smart Home, Hausgeräte, Elektroinstallation): Ein Klick öffnet den jeweiligen Bereich. Der grüne Punkt zeigt, dass der Bereich auf der Website sichtbar ist.</li>\n<li><b>Statusanzeige</b> oben: „Keine Änderungen“, „Ungespeicherte Änderungen“ oder „Gespeichert ✓“.</li>\n<li><b>Speichern</b>: übernimmt alle Änderungen.</li>\n<li><b>Website öffnen</b>: zeigt die Website mit Ihren Preisen (Online-Test).</li>\n<li><b>Originalpreise wiederherstellen</b> (Online-Test) bzw. <b>Letzte Speicherung rückgängig</b> (am PC): macht die Änderungen rückgängig.</li>\n<li><b>Kopie herunterladen</b>: lädt die komplette Website mit Ihren Preisen als Datei herunter.</li>\n<li><b>Excel herunterladen</b> / <b>Excel importieren</b>: alle Preise als Excel-Tabelle bearbeiten und wieder einlesen (siehe Kapitel 13).</li>\n<li>In den Tabellen: <b>↑</b> schiebt eine Zeile nach oben, <b>×</b> löscht sie (zur Sicherheit zweimal klicken), <b>+ Zeile hinzufügen</b> legt eine neue Zeile an, der Schalter <b>Aktiv</b> blendet ein Gerät aus, ohne es zu löschen, und <b>⬆</b> lädt ein Bild hoch.</li>\n</ul>\n</section>\n\n<section class=\"man-sec\" id=\"m-stundensatz\">\n<h2>3. Stundensatz, Anfahrt und MwSt. ändern</h2>\n<ol>\n<li>Reiter <b>Allgemein</b> öffnen.</li>\n<li>Unter „Arbeitslohn und Angebot“ den neuen Wert eintragen, z. B. beim <b>Stundensatz Monteur</b>.</li>\n<li>Oben auf <b>Speichern</b> klicken, dann auf <b>Website öffnen</b>.</li>\n</ol>\n<div class=\"bsp\"><b>Beispiel:</b> Sie ändern den Stundensatz von <b>68 €</b> auf <b>75 €</b>. Eine Klimaanlage für ein Schlafzimmer mit 16 m² kostet im Rechner dann <b>2.613 €</b> statt <b>2.536 €</b> – weil alle Montagestunden mit dem neuen Satz berechnet werden. Die <b>Anfahrt</b> (z. B. 45 €) wird pro Angebot nur einmal berechnet, auch wenn der Kunde mehrere Bereiche wählt.</div>\n<p>Weitere Werte im Reiter Allgemein: <b>Preisspanne</b> (z. B. ± 8 % – der Kunde sieht „von … bis …“), <b>Gültigkeit des Angebots</b> (z. B. 30 Tage) und <b>MwSt.</b> (19 %).</p>\n</section>\n\n<section class=\"man-sec\" id=\"m-geraetepreis\">\n<h2>4. Gerätepreis ändern</h2>\n<ol>\n<li>Reiter des Bereichs öffnen, z. B. <b>Klimaanlage</b>.</li>\n<li>In der Tabelle die Zeile des Geräts suchen und in der Spalte <b>Nettopreis</b> den neuen Preis eintragen.</li>\n<li><b>Speichern</b>.</li>\n</ol>\n<div class=\"bsp\"><b>Beispiel:</b> Das Toshiba Seiya 2,5 kW kostet im Einkauf mehr. Sie ändern den Nettopreis von <b>990 €</b> auf <b>1.090 €</b>. Der Richtpreis für das 16-m²-Schlafzimmer steigt von <b>2.536 €</b> auf <b>2.655 €</b> (100 € netto + 19 % MwSt.).</div>\n</section>\n\n<section class=\"man-sec\" id=\"m-neugeraet\">\n<h2>5. Neues Gerät hinzufügen</h2>\n<ol>\n<li>Reiter öffnen, z. B. <b>Klimaanlage</b>, Tabelle „Single-Split-Geräte“.</li>\n<li>Unter der Tabelle auf <b>+ Zeile hinzufügen</b> klicken.</li>\n<li>Hersteller, Modell, Leistung (kW), Klasse (Standard/Premium) und Nettopreis eintragen. Optional ein Bild hochladen (⬆).</li>\n<li><b>Speichern</b>.</li>\n</ol>\n<div class=\"bsp\"><b>Beispiel:</b> Neues Gerät „Toshiba Seiya 2,0 kW“, Leistung <b>2,0</b>, Klasse <b>Standard</b>, Nettopreis <b>930 €</b>. Für kleine Räume wählt die Website ab jetzt automatisch dieses Gerät – denn sie nimmt immer das <b>kleinste Gerät, dessen Leistung ausreicht</b>; bei gleicher Leistung das <b>günstigste</b>.</div>\n<p>So funktioniert die Auswahl in den Bereichen:</p>\n<ul>\n<li><b>Klimaanlage</b>: pro Raum das kleinste passende Gerät in der vom Kunden gewählten Klasse; bei mehreren Räumen ein Multi-Split-Außengerät mit genügend Anschlüssen.</li>\n<li><b>Wärmepumpe</b>: das kleinste Gerät, das die berechnete Heizlast deckt.</li>\n<li><b>Photovoltaik</b>: Verwendet wird das <b>erste Modul</b> der Liste (mit ↑ nach oben schieben). Der Wechselrichter muss mindestens 80 % der Modulleistung erreichen. Speicher wählt der Kunde selbst.</li>\n</ul>\n</section>\n\n<section class=\"man-sec\" id=\"m-aktiv\">\n<h2>6. Gerät vorübergehend ausschalten, löschen oder umsortieren</h2>\n<ul>\n<li><b>Ausschalten</b>: Schalter <b>Aktiv</b> in der Zeile auf grau stellen und speichern. Das Gerät bleibt gespeichert, wird Kunden aber nicht mehr angeboten. Zum Wiedereinschalten den Schalter wieder auf grün stellen.</li>\n<li><b>Löschen</b>: auf <b>×</b> klicken und – zur Sicherheit – ein zweites Mal klicken.</li>\n<li><b>Reihenfolge</b>: mit <b>↑</b> nach oben schieben (wichtig bei den PV-Modulen).</li>\n</ul>\n<div class=\"bsp\"><b>Beispiel:</b> Ein Gerät ist zurzeit nicht lieferbar. Sie schalten „Aktiv“ aus – der Rechner nimmt automatisch das nächstpassende Gerät. Ist es wieder lieferbar, schalten Sie es einfach wieder ein.</div>\n</section>\n\n<section class=\"man-sec\" id=\"m-bild\">\n<h2>7. Produktbild hochladen</h2>\n<ol>\n<li>In der Tabelle (Klimaanlage, Wärmepumpe, Wallboxen oder Hausgeräte) in der Spalte <b>Bild</b> auf <b>⬆</b> klicken.</li>\n<li>Bild auswählen (Foto vom Handy oder Datei vom PC). Es wird automatisch verkleinert.</li>\n<li><b>Speichern</b>. Mit <b>×</b> neben dem Bild entfernen Sie es wieder.</li>\n</ol>\n<div class=\"bsp\"><b>Tipps:</b> Am besten ein quadratisches Bild mit weißem Hintergrund. Verwenden Sie Produktbilder aus den Händlerportalen Ihrer Partner (z. B. Toshiba, Siemens) – dort haben Sie als Fachhändler das Recht, die Bilder zu nutzen. Der Rechner zeigt das Bild des empfohlenen Geräts direkt im Angebot an.</div>\n</section>\n\n<section class=\"man-sec\" id=\"m-wallbox\">\n<h2>8. Wallboxen</h2>\n<p>Alle Wallboxen stehen in einer gemeinsamen Liste im Reiter <b>Elektroinstallation</b>. Der Kunde wählt die Wallbox im Rechner – bei der Elektroinstallation und bei der Photovoltaik („mit PV-Überschussladen“).</p>\n<ol>\n<li>Reiter <b>Elektroinstallation</b> → Tabelle „Wallboxen“ → <b>+ Zeile hinzufügen</b>.</li>\n<li>Hersteller, Modell, Leistung (kW) und Nettopreis eintragen, optional Bild hochladen.</li>\n<li>Die <b>Montagestunden</b> stehen darunter (Elektroinstallation) bzw. im Reiter Photovoltaik (mit PV).</li>\n</ol>\n<div class=\"bsp\"><b>Beispiel:</b> Sie nehmen die „Webasto Unite 11 kW“ für <b>780 €</b> netto auf. Im Rechner erscheint sie sofort in der Auswahlliste. Eine Wallbox, die Sie nicht mehr verkaufen, schalten Sie mit „Aktiv“ aus.</div>\n</section>\n\n<section class=\"man-sec\" id=\"m-hausgeraete\">\n<h2>9. Hausgeräte: neuen Partner und Produkte anlegen</h2>\n<p>Im Reiter <b>Hausgeräte</b> pflegen Sie die Online-Bestellung: Partner (Marken), Produkte und die Preise für Lieferung und Altgerät.</p>\n<h3>Neuen Partner anlegen</h3>\n<ol>\n<li>Tabelle „Partner / Marken“ → <b>+ Zeile hinzufügen</b>.</li>\n<li>Namen eintragen, z. B. <b>Bosch Hausgeräte</b>. Schalter „Aktiv“ grün lassen.</li>\n</ol>\n<h3>Produkt anlegen</h3>\n<ol>\n<li>Tabelle „Produkte“ → <b>+ Zeile hinzufügen</b>.</li>\n<li>Bei <b>Hersteller</b> den Partner auswählen, dann Kategorie, Modell, Kurzbeschreibung, <b>Bruttopreis</b> und den Preis für <b>Anschluss/Montage</b> (brutto) eintragen. Bild mit ⬆ hochladen.</li>\n<li><b>Speichern</b> – das Produkt erscheint sofort auf der Seite „Hausgeräte“.</li>\n</ol>\n<div class=\"bsp\"><b>Beispiel:</b> Partner „Bosch Hausgeräte“, Produkt: Kategorie <b>Waschmaschine</b>, Modell <b>Serie 6 Waschmaschine 9 kg</b>, Bruttopreis <b>899 €</b>, Anschluss <b>49 €</b>. Schreiben Sie Kategorien immer gleich (z. B. immer „Waschmaschine“), dann kann der Kunde sauber danach filtern.</div>\n<h3>Lieferung, Altgerät und Lieferzeit</h3>\n<p>Unter „Leistungen“: <b>Lieferung pro Gerät</b> (z. B. 39 €), <b>Altgerät-Mitnahme</b> (z. B. 25 €) und der Text zur <b>Lieferzeit</b>, den der Kunde sieht.</p>\n<div class=\"bsp\"><b>Rechenbeispiel aus der Website:</b> 2 × Waschmaschine 599 € mit Anschluss (2 × 49 €) und Altgerät-Mitnahme (2 × 25 €) plus 1 × Geschirrspüler 649 € mit Montage (149 €), Lieferung für 3 Geräte (3 × 39 €) = <b>2.261,00 €</b> inkl. 361,00 € MwSt. Bei Abholung im Fachgeschäft entfallen Lieferung und Altgerät: <b>2.094,00 €</b>.</div>\n<p><b>Partner ausschalten:</b> Schalter „Aktiv“ beim Partner auf grau – der Partner und alle seine Produkte verschwinden aus der Online-Bestellung.</p>\n</section>\n\n<section class=\"man-sec\" id=\"m-sichtbar\">\n<h2>10. Bereiche, Hausgeräte-Bestellung und Chat ein- oder ausblenden</h2>\n<ol>\n<li>Reiter <b>Allgemein</b> → „Sichtbare Bereiche auf der Website“.</li>\n<li>Schalter auf grau = ausgeblendet, grün = sichtbar. <b>Speichern</b>.</li>\n</ol>\n<div class=\"bsp\"><b>Beispiel:</b> Sie möchten im Sommer keine neuen Smart-Home-Anfragen. Sie schalten „Smart Home“ aus: Der Bereich verschwindet aus dem Rechner, der Schnellauswahl und dem Footer. Die Beschreibung unter „Leistungen“ bleibt mit dem Button „Beratung anfragen“. Genauso blenden Sie die <b>Hausgeräte-Bestellung</b> oder den <b>Chat-Assistenten „Fragen?“</b> aus.</div>\n</section>\n\n<section class=\"man-sec\" id=\"m-kfw\">\n<h2>11. KfW-Förderung aktuell halten</h2>\n<p>Im Reiter <b>Allgemein</b> stehen die Werte für den KfW-Zuschuss (Programm 458). Die KfW ändert sie regelmäßig – die nächsten bekannten Termine:</p>\n<ul>\n<li>ab <b>1.2.2027</b>: Klimageschwindigkeitsbonus <b>12 %</b> (statt 16 %), förderfähige Kosten <b>27.250 €</b> (statt 28.000 €)</li>\n<li>ab <b>1.8.2027</b>: Klimageschwindigkeitsbonus <b>8 %</b>, förderfähige Kosten <b>26.500 €</b></li>\n</ul>\n<div class=\"bsp\"><b>Beispiel aus dem Rechner:</b> Wärmepumpe für 150 m², teilsaniert, bisher Ölheizung, Eigentümer wohnt selbst: Richtpreis <b>26.250 €</b>, voraussichtlicher KfW-Zuschuss <b>12.050 €</b> (30 % Grundförderung + 16 % Klimageschwindigkeitsbonus). Mit Einkommensbonus steigt der Satz bis zum Höchstsatz von 70 % (bei Einkommen bis 30.000 €: 80 %).</div>\n<p>Die Texte im Bereich „Förderung &amp; Vorschriften“ auf der Website haben den Stand Oktober 2026 – bei Änderungen passen wir sie an.</p>\n</section>\n\n<section class=\"man-sec\" id=\"m-speichern\">\n<h2>12. Speichern, prüfen und rückgängig machen</h2>\n<h3>Online-Test</h3>\n<ol>\n<li>Änderungen machen → <b>Speichern</b> → <b>Website öffnen</b>.</li>\n<li>Oben auf der Website steht „Testpreise aus der Preisverwaltung aktiv“.</li>\n<li>Mit <b>Originalpreise wiederherstellen</b> (in der Preisverwaltung oder oben auf der Website) ist alles wieder wie vorher.</li>\n</ol>\n<p>Wichtig: Die Testpreise gelten nur in diesem Browser auf diesem Gerät. Andere Personen sehen die Originalpreise.</p>\n<h3>Auf der echten Website (online, mit Passwort)</h3>\n<ol>\n<li><b>www.elektro-ulshoefer.de/verwaltung/</b> öffnen und mit Ihrem Passwort anmelden.</li>\n<li>Preise ändern oder Bereiche und Buttons ein- bzw. ausschalten – genau wie im Online-Test.</li>\n<li><b>Speichern</b>: Die Änderung gilt <b>sofort für alle Besucher</b>. Bei jedem Speichern wird automatisch eine Sicherung angelegt (die letzten 50 Versionen).</li>\n<li>Mit <b>Vorherige Version wiederherstellen</b> machen Sie die letzte Speicherung rückgängig. <b>Abmelden</b> beendet die Sitzung; nach 2 Stunden ohne Aktivität geschieht das automatisch.</li>\n</ol>\n<div class=\"bsp\"><b>Beispiel:</b> Sie melden sich am Handy an, stellen im Reiter Allgemein den Stundensatz von 68 € auf 72 € und schalten unter „Sichtbare Bereiche“ Smart Home aus. Nach „Speichern“ rechnet die Website sofort mit 72 € und zeigt Smart Home nicht mehr an. Nach fünf falschen Passwörtern ist die Anmeldung 15 Minuten gesperrt.</div>\n<h3>Am PC mit der Website-Datei</h3>\n<ol>\n<li><i>ulshoefer-admin.html</i> öffnen (am besten mit Chrome oder Edge) und die Website-Datei mit der <b>höchsten Versionsnummer</b> wählen, z. B. <i>ulshoefer-v0.9.12.html</i>.</li>\n<li>Änderungen machen → <b>Speichern</b>. Der Browser fragt einmal nach der Erlaubnis, die Datei zu ändern – mit „Zulassen“ bestätigen.</li>\n<li>Die Website-Datei im Browser neu laden (<b>F5</b>) – die neuen Preise sind drin.</li>\n<li>Mit <b>Letzte Speicherung rückgängig</b> stellen Sie den vorherigen Stand wieder her.</li>\n</ol>\n</section>\n\n<section class=\"man-sec\" id=\"m-excel\">\n<h2>13. Preise mit Excel ändern und selbst einlesen</h2>\n<p>Viele Preise auf einmal ändern Sie am bequemsten in Excel – und lesen die Tabelle danach selbst wieder ein. Dafür brauchen Sie niemanden.</p>\n<ol>\n<li>In der Preisverwaltung oben auf <b>Excel herunterladen</b> klicken. Sie erhalten die Preisliste mit allen <b>aktuellen</b> Werten (Dateiname z. B. <i>Ulshoefer-Preisliste-2026-10-25.xlsx</i>).</li>\n<li>Die Datei in Excel öffnen und nur die <b>gelben Zellen mit blauer Schrift</b> ändern: Nettopreise, Stunden, „Ja“/„Nein“ bei „Aktiv“ und „Sichtbar“.</li>\n<li><b>Neue Geräte</b> tragen Sie in die freien gelben Zeilen unter der jeweiligen Tabelle ein. Ein Gerät, das Sie nicht mehr anbieten möchten, stellen Sie in der Spalte „Aktiv“ auf <b>Nein</b>.</li>\n<li>Datei speichern (als Excel-Datei <i>.xlsx</i>).</li>\n<li>In der Preisverwaltung auf <b>Excel importieren</b> klicken und die gespeicherte Datei wählen.</li>\n<li>Die Preisverwaltung meldet, wie viele Werte sich geändert haben; geänderte Felder sind farbig markiert. Kurz prüfen und auf <b>Speichern</b> klicken – fertig.</li>\n</ol>\n<div class=\"bsp\"><b>Beispiel:</b> Sie laden die Excel-Tabelle herunter, ändern im Blatt „Allgemein“ den Stundensatz auf <b>75 €</b>, im Blatt „Klimaanlage“ den Nettopreis des Toshiba Seiya 2,5 kW auf <b>1.090 €</b>, stellen alle Daikin-Geräte bei „Aktiv“ auf <b>Nein</b> und tragen in einer freien Zeile ein neues Gerät ein (Toshiba, Seiya 2,0 kW, 2, Standard, 930). Nach „Excel importieren“ meldet die Preisverwaltung, wie viele Werte sich geändert haben und dass ein neues Gerät dazugekommen ist. Nach „Speichern“ rechnet die Website sofort mit den neuen Werten.</div>\n<ul>\n<li><b>Graue Zellen</b> rechnen automatisch (Bruttopreis, Arbeitslohn) – bitte nicht überschreiben.</li>\n<li>Blätter, Spalten und Überschriften nicht verschieben oder löschen. Das ausgeblendete Blatt „_zuordnung“ wird für den Import gebraucht.</li>\n<li>Produktbilder bleiben beim Import erhalten; neue Bilder laden Sie in der Preisverwaltung hoch (⬆).</li>\n<li>Preise dürfen auch als Text eingetragen werden, z. B. „1.090,00 €“ – die Preisverwaltung erkennt das.</li>\n<li>Laden Sie vor größeren Änderungen immer eine frische Tabelle mit „Excel herunterladen“ – dann arbeiten Sie garantiert mit dem aktuellen Stand.</li>\n</ul>\n</section>\n\n<section class=\"man-sec\" id=\"m-recht\">\n<h2>14. Energielabel, Datenblätter und Online-Verkauf</h2>\n<p>Wer im Internet Geräte mit Preis zeigt, muss bestimmte Pflichtangaben machen. Die Website erledigt das automatisch – Sie tragen nur die Daten ein.</p>\n<h3>Energieklasse, Energielabel und Produktdatenblatt</h3>\n<ol>\n<li>Reiter <b>Klimaanlage</b> (Single-Split und Multi-Split-Außengeräte), <b>Wärmepumpe</b> oder <b>Hausgeräte</b> öffnen.</li>\n<li>In der Zeile des Geräts die <b>Energieklasse</b> wählen (bei Klimaanlagen getrennt für Kühlen und Heizen).</li>\n<li>In der EU-Datenbank <b>EPREL</b> (eprel.ec.europa.eu) nach der Modellnummer suchen. Den Link zum <b>Energielabel</b> in die Spalte „Link Energielabel“ kopieren, den Link zum <b>Produktdatenblatt</b> in „Link Produktdatenblatt“.</li>\n<li><b>Speichern</b>. Auf der Website erscheint neben dem Preis ein farbiger Pfeil mit der Klasse; ein Klick öffnet das Label, daneben steht „Produktdatenblatt“.</li>\n</ol>\n<div class=\"bsp\"><b>Beispiel:</b> Toshiba Seiya RAS-B10E2KVG-E (laut Toshiba-Datenblatt): Energieklasse Kühlen <b>A++</b>, Heizen <b>A++</b>, SEER 7,0, SCOP 4,6, Schalldruck ab 19 dB(A), Kältemittel R32. In EPREL die Modellnummer „RAS-10E2AVG-E“ suchen und die beiden Links eintragen. Bei Hausgeräten zusätzlich die <b>Label-Skala</b> wählen: Waschmaschinen, Geschirrspüler und Kühlgeräte „A–G (neu)“, Backöfen und Wäschetrockner „A+++–D“.</div>\n<p><b>Herkunft der Daten:</b> Alle Klimageräte, technischen Werte, Fotos und Datenblatt-Links stammen von den offiziellen Herstellerseiten (Toshiba: toshiba-aircondition.com / Datenblätter AIR-COND, Daikin: daikin.de, Mitsubishi Electric: mitsubishi-les.com, Stand Oktober 2026). Nicht mehr lieferbare Serien (z. B. Daikin Sensira, Perfera FTXM-R) wurden durch die aktuellen ersetzt. Bei Daikin-Multi-Außengeräten hängt die Energieklasse von der Kombination ab – dort bitte die Klasse aus EPREL eintragen. Die Preise sind weiterhin Beispielpreise. Solange kein Energielabel-Link eingetragen ist, führt der Pfeil zur EPREL-Suche.</p>\n<p><b>Hersteller wählen:</b> Wählt der Kunde im Rechner einen Hersteller (z. B. Toshiba), zeigt die Website nur noch Geräte dieses Herstellers – passend zur Raumgröße. Bei mehreren Räumen wird automatisch eine Dual-, Trial-, Quadro- oder Penta-Split-Anlage desselben Herstellers berechnet.</p>\n<p><b>Bauart:</b> Zusätzlich wählt der Kunde die Bauart: Wandgerät, Truhengerät/Bodenkonsole, Deckenkassette oder Kanalgerät. Toshiba ist komplett nach dem Katalog HOME 2026/2027 hinterlegt (Seiya Classic 2, Seiya, Shorai Curve White/Black, Haori, Daiseikai 10 White/Wood, Konsole, Kanalgerät, 60×60-Kassette, 1-Wege-Flachkassette und alle Multi-Außengeräte von 2M10 bis 5M34). Kassetten und Kanalgeräte gibt es nur als Mehrraum-Anlage. In der Preisverwaltung legen Sie die Bauart in der Spalte „Bauart“ fest.</p>\n<h3>Herstellerbroschüren</h3>\n<p>Im Reiter <b>Klimaanlage</b> steht die Tabelle <b>Herstellerbroschüren</b> mit den offiziellen PDF-Katalogen: Toshiba „HOME – Ihr Zuhause, Ihr Klima“ (Katalog 2026/2027), Daikin „Split-Klimaanlagen Wandgeräte“ (Produktkatalog) und Mitsubishi Electric „Das Wandgerät MSZ-AY“ sowie „M-Serie“. Auf der Website erscheinen sie unter den empfohlenen Modellen – hat der Kunde einen Hersteller gewählt, nur dessen Broschüren – und als Link „Broschüre …“ auf jeder Modellkarte. Erscheint ein neuer Katalog, tragen Sie einfach den neuen Link ein; mit „Aktiv“ blenden Sie eine Broschüre aus.</p>\n<div class=\"bsp\"><b>Beispiel:</b> Toshiba veröffentlicht den Katalog 2027/2028. Sie kopieren den Link zur PDF-Datei von toshiba-aircondition.com in die Spalte „Link zum PDF“, ändern den Titel auf „… Katalog 2027/2028“ und speichern. Die Broschüren sind nur verlinkt, nicht kopiert – so bleiben die Urheberrechte der Hersteller gewahrt und der Kunde sieht immer die aktuelle Fassung.</div>\n<h3>Dimensionierung: welche Leistung braucht der Raum?</h3>\n<p>Der Rechner ermittelt die Kühlleistung so: <b>Raumfläche × 80 W/m²</b> (Wert „Leistung pro m²“ im Reiter Klimaanlage, eingetragen als 0,08 kW) × Raumart (Wohnzimmer × 1,05, Büro × 1,15, Dachgeschoss × 1,3) × Gebäude (Neubau gut gedämmt × 0,75 = 60 W/m², durchschnittlich × 1, Altbau wenig gedämmt × 1,25 = 100 W/m²) × Sonneneinstrahlung (stark, große Süd- oder Westfenster: × 1,2). Das entspricht den üblichen Faustwerten von 60 bis 100 W/m². In der Raumzeile sieht der Kunde den Bedarf, z. B. „Bedarf 1,6 kW“.</p>\n<p>Unter „Anderes Modell mit passender Leistung wählen“ erscheinen nur Geräte in dieser Leistungsgröße: aus jeder Serie das kleinste Gerät, das den Bedarf deckt. Ändert der Kunde danach die Raumgröße und passt sein gewähltes Gerät nicht mehr, wählt der Rechner wieder automatisch das passende Gerät.</p>\n<div class=\"bsp\"><b>Beispiel:</b> Schlafzimmer 20 m², durchschnittlich gedämmt, normale Sonne: 20 × 80 W = <b>1,6 kW</b> → angeboten werden nur Geräte mit <b>2,5 kW</b> (z. B. Toshiba Seiya, Daikin Comfora 25, Mitsubishi MSZ-AY25). Wohnzimmer 40 m² mit großen Südfenstern: 40 × 80 W × 1,05 × 1,2 = <b>4,0 kW</b> → Geräte ab <b>4,2 kW</b>. Die genaue Kühllast prüfen Sie bei der Besichtigung.</div>\n<h3>Klimaanlage: Kunde sieht und wählt das Modell</h3>\n<p>Im Rechner sieht der Kunde zu jedem Raum das empfohlene Gerät mit Foto, Energieklassen und technischen Daten. Unter „Anderes Modell wählen“ stehen alle passenden Alternativen mit Preisunterschied; der Richtpreis rechnet sofort neu. Bei Multi-Split-Anlagen sind Innen- und Außengeräte immer vom selben Hersteller. Hat der Kunde ein bestimmtes Wunschgerät, trägt er es ins Feld „Sie haben ein bestimmtes Modell im Blick?“ ein – es steht dann im Angebot. Je mehr Bilder, Werte und Datenblatt-Links Sie eintragen, desto vollständiger ist die Modellkarte.</p>\n<h3>Kundeninformationen, Widerruf und „Vertrag widerrufen“</h3>\n<ul>\n<li>Die Seite <b>Kundeninformationen &amp; Widerrufsbelehrung</b> (Link im Footer) enthält Vertragsschluss, Preise, Lieferkosten, Liefergebiet, Zahlung, Mängelhaftung, Widerrufsbelehrung, Muster-Widerrufsformular und Hinweise zur Altgeräte-Entsorgung.</li>\n<li>Lieferkosten, Altgerät-Mitnahme, Lieferzeit, <b>Liefergebiet</b> und <b>Zahlungsarten</b> pflegen Sie im Reiter <b>Hausgeräte</b> unter „Leistungen“ – sie erscheinen dort automatisch.</li>\n<li>Seit 19. Juni 2026 ist der <b>Widerrufsbutton</b> Pflicht: Im Footer und auf der Hausgeräte-Seite steht „Vertrag widerrufen“. Der Kunde gibt Namen, Auftrags- bzw. Anfrage-Nr. und E-Mail ein und klickt „Widerruf bestätigen“. Auf der fertigen Website muss er danach automatisch eine Eingangsbestätigung mit Datum und Uhrzeit per E-Mail erhalten.</li>\n<li>In der Bestellanfrage bestätigt der Kunde, dass er Kundeninformationen und Widerrufsbelehrung gelesen hat. Wählt er Anschluss/Montage, kann er ausdrücklich verlangen, dass Sie schon vor Ablauf der 14-tägigen Widerrufsfrist montieren.</li>\n<li>Bei Klimageräten steht der Pflichthinweis zur F-Gase-Verordnung: Installation nur durch einen zertifizierten Fachbetrieb.</li>\n</ul>\n<div class=\"bsp\"><b>Bitte prüfen lassen:</b> Die Rechtstexte sind sorgfältig erstellte Entwürfe nach dem Stand Oktober 2026 (u. a. § 356a BGB, Energieverbrauchskennzeichnung, F-Gase-Verordnung, ElektroG). Vor dem Start der echten Website bitte von Rechtsanwalt, Handwerkskammer oder Händlerbund prüfen lassen – vor allem Zahlungsarten, Liefergebiet und die Rücknahme der Waren („Wir holen die Waren auf unsere Kosten ab“).</div>\n</section>\n\n<section class=\"man-sec\" id=\"m-kunde\">\n<h2>15. Was der Kunde auf der Website macht</h2>\n<ul>\n<li><b>Online-Angebot</b>: Der Kunde wählt einen oder mehrere Bereiche, macht seine Angaben und sieht sofort einen Richtpreis mit Spanne. Mit „Angebot erstellen“ erhält er ein Dokument zum Drucken und kann es per E-Mail an Sie senden. Verbindlich wird der Preis erst nach Ihrer Besichtigung.</li>\n<li><b>Hausgeräte</b>: Der Kunde wählt Geräte, Lieferung, Anschluss und Altgerät und erstellt eine <b>Bestellanfrage</b>. Der Kauf kommt erst mit Ihrer Auftragsbestätigung zustande.</li>\n<li><b>Chat-Assistent „Fragen?“</b>: beantwortet häufige Fragen sofort und nimmt Rückrufbitten auf.</li>\n<li><b>Videos</b>: Zu Photovoltaik, Wärmepumpe, Klimaanlage und Elektroinstallation gibt es kurze Erklärvideos (30–35 Sekunden), dazu die Filme „Intelligent modernisieren“ (54 Sekunden) und „Smart Home – Elektrotechnik mit einer Hand“ (1 Minute, mit Photovoltaik und E-Auto-Laden). Die Videos laufen direkt auf der Seite mit, sobald man hinscrollt, und haben Untertitel. Die bisherige Computerstimme wurde entfernt; sobald Herr Ulshöfer die Sprechertexte (PDF „Sprechertexte-Videos-Ulshoefer“) aufgenommen hat, bekommen alle Videos eine echte Stimme. Der Kunde startet sie mit „Video ansehen“.</li>\n<li><b>Intelligent modernisieren</b> und <b>Service &amp; Kundendienst</b>: eigene Bereiche auf der Startseite mit den wichtigsten Leistungen.</li>\n<li><b>Kontaktformular</b> und <b>Rückruf</b>: Alle Anfragen kommen per E-Mail an <b>info@elektro-ulshoefer.de</b>.</li>\n</ul>\n<div class=\"bsp\"><b>Hinweis zur Vorschau:</b> In der Vorschau öffnet sich bei Anfragen das E-Mail-Programm des Kunden mit fertig ausgefülltem Text. Auf der endgültigen Website kann das auf Wunsch direkt über den Server laufen.</div>\n</section>\n\n<section class=\"man-sec\" id=\"m-faq\">\n<h2>16. Häufige Fragen</h2>\n<dl>\n<dt>Ich habe Preise geändert, sehe sie aber auf dem Handy nicht.</dt>\n<dd>Im Online-Test gelten Änderungen nur auf dem Gerät, auf dem Sie gespeichert haben. Ändern Sie die Preise auf dem Handy oder öffnen Sie die Website auf demselben Gerät.</dd>\n<dt>Ein Gerät wird im Rechner nie angeboten.</dt>\n<dd>Prüfen Sie: Ist „Aktiv“ eingeschaltet? Gibt es ein kleineres oder günstigeres Gerät mit ausreichender Leistung? Hat der Kunde einen anderen Hersteller gewählt?</dd>\n<dt>Netto oder brutto?</dt>\n<dd>Netto in allen Reitern außer <b>Hausgeräte</b> – dort brutto wie im Laden.</dd>\n<dt>Kann ich etwas kaputt machen?</dt>\n<dd>Nein. Im Online-Test genügt „Originalpreise wiederherstellen“, am PC „Letzte Speicherung rückgängig“. Außerdem bleiben alle früheren Website-Versionen gespeichert.</dd>\n</dl>\n</section>\n";/*MANUAL_END*/

    const lists=['klima.geraete_single','klima.innengeraete_multi','klima.aussengeraete_multi','wp.geraete','pv.module','pv.wechselrichter','pv.speicher','wallboxen','shop.partner','shop.produkte'];const added=lists.reduce((a,p)=>a+Math.max(0,cnt(p)),0),removed=lists.reduce((a,p)=>a+Math.max(0,-cnt(p)),0);
    showImport(n,added,removed,warn)}catch(e){console.error(e);showImport(-1,0,0,[e.message||'Die Datei konnte nicht gelesen werden.'])}}
function showImport(n,added,removed,warn){const box=$('#xlResult');if(!box)return;
  box.innerHTML=n<0?`<b>Import nicht möglich.</b> ${esc(warn[0]||'')}`:(n===0?'<b>Import abgeschlossen:</b> keine Änderungen gefunden – die Tabelle entspricht den aktuellen Werten.':`<b>Import abgeschlossen:</b> ${n} Wert${n>1?'e':''} geändert${added?`, ${added} neue${added>1?'':'s'} Gerät${added>1?'e':''}/Produkt${added>1?'e':''}`:''}${removed?`, ${removed} entfernt`:''}. Geänderte Felder sind farbig markiert. <b>Bitte prüfen und auf „Speichern“ klicken.</b>${warn.length?`<br><small>Hinweise: ${warn.slice(0,5).map(esc).join(' · ')}</small>`:''}`);
  box.hidden=false;box.className='xlres'+(n<0?' bad':'');box.scrollIntoView({block:'nearest'})}
$('#xlDown').addEventListener('click',xlDownload);
$('#xlIn').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';xlImport(f)});
window.__XL=XL;
/*XLSX_END*/

})();
